# RustSec advisory audit of both lockfiles, the root's and fuzz/'s (its own
# workspace), mirroring xbrlstd-rs's audit.yml
# (its ADR220). Beside the gate, not in it: the advisory database moves
# independently of the code, so this workflow can turn red on a day nobody
# committed. That red is the signal it exists for, and keeping it out of
# ci.yml means such a day cannot redden the commit gate.
#
# Vulnerabilities fail the job. Informational warnings (unmaintained,
# unsound) print without failing it. There is no ignore list: accepting an
# advisory is a recorded decision, carried by `.cargo/audit.toml`, which
# cargo-audit reads from the checkout root.

name: Advisory audit

on:
  schedule:
    # Daily, off the hour: an advisory published today reaches us tomorrow
    # at the latest, with no commit needed to trigger the run.
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

# Every job names its runner's Ubuntu release (ubuntu-24.04), not ubuntu-latest,
# so a move to a new release is a commit here. GitHub still updates the
# image's software weekly and retires a label on its own schedule.
jobs:
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-24.04
    # cargo-audit runs `cargo -V` for its yanked-crate check; inside the tree
    # rustup would resolve that to the rust-toolchain.toml pin and install it
    # for a lockfile scan that needs no compiler. Point it at the runner's
    # preinstalled stable instead.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock
        run: cargo-audit audit --file Cargo.lock

      # Runs even when the root audit failed, so one red lockfile cannot hide
      # an advisory in the other.
      - name: Audit fuzz/Cargo.lock
        if: ${{ !cancelled() }}
        run: cargo-audit audit --file fuzz/Cargo.lock
