# Following a bunch of recommendations from
# https://corrode.dev/blog/tips-for-faster-ci-builds/

# .githooks/pre-commit runs the same gate on every commit that changes code;
# change them together.

name: Cargo Build & Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # disable incremental compilation for faster from scratch builds
  CARGO_INCREMENTAL: 0
  # disable debug info to increase caching efficiency
  CARGO_PROFILE_TEST_DEBUG: 0

# Every job names its runner's Ubuntu release (ubuntu-24.04), not ubuntu-latest,
# so a move to a new release is a commit here. GitHub still updates the
# image's software weekly and retires a label on its own schedule.
jobs:
  build_and_test:
    name: Cargo Build & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install the toolchain rust-toolchain.toml pins (channel, components,
      # profile) rather than floating on `stable`; without a toolchain name,
      # `rustup toolchain install` installs what that file names.
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      # caching
      - name: Cache Dependencies
        id: cache-dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Rust formatting
        run: cargo fmt --check --all

      - name: Check Rust lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      # we run these conformance tests in debug mode. While the debug tests run
      # more slowly we catch some bounds check errors that release mode
      # doesn't.
      - name: Check (XPath conformance suite)
        run: cargo run --bin xee-testrunner -- -v check vendor/xpath-tests/

      - name: Check (XSLT conformance suite)
        run: cargo run --bin xee-testrunner -- -v check vendor/xslt-tests/

      # rust-cache (v2.9.2) cleans target/tests/target and target/tests/trybuild
      # without awaiting either, so where target/tests exists and one of them
      # is missing, the ENOENT escapes its try/catch and the action prints it
      # as two ##[error] lines, in the restore step on a partial cache hit and
      # in the post step that saves the cache (Swatinem/rust-cache#193; the
      # fix is proposed in #387). trybuild, which xee-interpreter's macro_ui
      # test runs, creates target/tests/trybuild, but nothing creates
      # target/tests/target, so this step does, empty, and the saved cache
      # keeps it; it names trybuild's too, since the step itself creates
      # target/tests should trybuild stop running. It runs last, after cargo
      # has created target/ with its CACHEDIR.TAG, and the cache is saved only
      # when every step succeeds. Remove it once a rust-cache v2 release awaits
      # the calls.
      - name: Create the target/tests directories rust-cache's cleanup opens
        run: mkdir -p target/tests/target target/tests/trybuild
