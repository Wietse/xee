[package]
name = "xee-json"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
authors.workspace = true
keywords = ["json", "parser", "serializer", "xpath"]
license.workspace = true
description = "Strict RFC 8259 JSON pull tokenizer and writer for Xee"
repository.workspace = true
readme = "README.md"
homepage.workspace = true

# std only: no runtime dependencies.
[dependencies]

# The benchmark against serde_json (benches/tokenizer.rs) only.
[dev-dependencies]
divan = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.151"

[[bench]]
name = "tokenizer"
harness = false
