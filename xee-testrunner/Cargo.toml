[package]
name = "xee-testrunner"
version = "0.1.6"
edition.workspace = true
publish.workspace = true
authors.workspace = true
keywords = ["xml", "xpath", "xslt", "testing"]
license.workspace = true
description = "Conformance testing for Xee's XPath and XSLT implementations"
repository.workspace = true
readme = "README.md"
homepage.workspace = true

[dependencies]
xee-xpath-load = { workspace = true }
xee-xpath = { workspace = true }
# the dependency on the xslt compiler should be replaced with xee-xslt dependency
xee-xslt-compiler = { workspace = true }
xee-name = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
ahash = { workspace = true }
xot = { workspace = true }
fxhash = "0.2.1"
indexmap = "2.8.0"
clap = { workspace = true, features = ["derive"] }
crossterm = "0.28.1"
globset = "0.4.16"
chrono = { workspace = true }
ibig = { workspace = true }
iri-string = { workspace = true }
url = "2.5.4"

[dev-dependencies]
insta = { workspace = true, features = ["yaml", "glob"] }
tempfile = "3.19.0"
