[package]
name = "xee-xpath-macros"
version = "0.1.4"
description = "Proc macros for xee-interpreter function library"
authors.workspace = true
edition.workspace = true
publish.workspace = true
keywords = ["xml", "xpath"]
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true

[lib]
proc-macro = true

[dependencies]
xee-xpath-ast = { workspace = true }
xee-schema-type = { workspace = true }
proc-macro2 = { version = "1", default-features = false }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
xot = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
insta = { workspace = true, features = ["yaml", "glob"] }
xot = { workspace = true, features = ["serde"] }
