[package]
name = "xee-xpath"
version = "0.1.5"
edition.workspace = true
publish.workspace = true
authors.workspace = true
keywords = ["xml", "xpath"]
categories = ["text-processing", "compilers"]
license.workspace = true
description = "XPath 3.1 library API"
repository.workspace = true
readme = "README.md"
homepage.workspace = true

[features]
serde = ["xee-xpath-ast/serde", "xee-interpreter/serde"]

[dependencies]
xee-xpath-compiler = { workspace = true }
xee-xpath-ast = { workspace = true }
xee-schema-type = { workspace = true }
xee-interpreter = { workspace = true }
xee-ir = { workspace = true }
chrono = { workspace = true }
ahash = { workspace = true }
ordered-float = { workspace = true }
rust_decimal = { workspace = true }
ibig = { workspace = true }
thiserror = { workspace = true }
xot = { workspace = true }
iri-string = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["yaml", "glob"] }
rust_decimal_macros = { workspace = true }
divan = "0.1.17"
xee-xpath-macros = { workspace = true }

[[bench]]
name = "xpath"
harness = false
