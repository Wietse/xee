[package]
name = "xee-xslt-compiler"
version = "0.1.6"
edition.workspace = true
publish.workspace = true
authors.workspace = true
keywords = ["xml", "xslt"]
license.workspace = true
description = "XSLT 3.0 compiler to Xee IR"
repository.workspace = true
readme = "README.md"
homepage.workspace = true

[features]
serde = ["xee-xslt-ast/serde", "xee-interpreter/serde"]

[dependencies]
xee-name = { workspace = true }
xee-xpath-ast = { workspace = true }
xee-xpath-compiler = { workspace = true }
xee-xslt-ast = { workspace = true }
xee-schema-type = { workspace = true }
xee-interpreter = { workspace = true }
xee-ir = { workspace = true }
ahash = { workspace = true }
iri-string = { workspace = true }
ordered-float = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
ibig = { workspace = true }
thiserror = { workspace = true }
xot = { workspace = true }


[dev-dependencies]
insta = { workspace = true, features = ["yaml", "glob"] }
rust_decimal_macros = { workspace = true }
