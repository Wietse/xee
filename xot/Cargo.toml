[package]
name = "xot"
version = "0.31.2"
edition.workspace = true
publish.workspace = true
license = "MIT"
description = "Full-featured XML tree library for Rust"
authors = ["Martijn Faassen <faassen@startifact.com>"]
homepage = "https://github.com/faassen/xot"
documentation = "https://docs.rs/xot"
repository = "https://github.com/faassen/xot"
readme = "README.md"
keywords = ["xml", "tree", "dom"]

[features]
proptest = ["dep:proptest"]
serde = ["dep:serde"]
icu = ["dep:icu"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
ahash = { workspace = true }
indextree = "^4.7.2"
xmlparser = "^0.13.6"
proptest = { version = "1.0.0", optional = true }
encoding_rs = "^0.8.34"
xhtmlchardet = "2.2.0"
serde = { workspace = true, features = ["derive"], optional = true }
icu = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
rstest = "0.16.0"
proptest = "1.0.0"
